# Copy to secrets.yaml (never commit it) and fill in.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# LAN IP of the computer running the ADI backend (NOT localhost / 127.0.0.1).
backend_host: "192.168.1.15"
# Must match DEVICE_TOKENS (esp32-desk:<token>) or DEVICE_SHARED_TOKEN in the backend .env
device_token: "change-me-long-random-secret"
ota_password: "change-me-too"
# Spotify developer app (https://developer.spotify.com/dashboard) - the same Client ID /
# Secret the ADI backend uses. Needed by Spotify Connect (cspot) on the speaker.
spotify_client_id: "YOUR_SPOTIFY_CLIENT_ID"
spotify_client_secret: "YOUR_SPOTIFY_CLIENT_SECRET"
